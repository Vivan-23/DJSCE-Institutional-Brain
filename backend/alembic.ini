# Database migrations (Alembic). The URL comes from app settings (DATABASE_URL), not this file.
#   Create a migration after changing models/structured.py:
#     alembic revision --autogenerate -m "describe the change"
#   Apply (also done automatically on backend startup):
#     alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
