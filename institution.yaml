# ── Student Help Desk ────────────────────────────────────────────────────────
# Tickets are triaged into one of these categories and routed to its owner.
# `keywords` drive the offline fallback classifier; `quick_questions` appear as
# one-click prompts on the Help Desk page.
helpdesk:
  categories:
    - key: "academics"
      label: "Courses & Curriculum"
      routed_to: "Board of Studies / Department Office"
      keywords: [course, syllabus, semester, elective, credit, curriculum, subject, lab, project]
      quick_questions:
        - "What courses are in Semester V of Computer Engineering?"
        - "Which department electives are offered in Semester VI?"
        - "What are the Program Outcomes of Information Technology?"
    - key: "examinations"
      label: "Examinations & Results"
      routed_to: "Examination Cell"
      keywords: [exam, test, result, marks, grade, revaluation, re-evaluation, moderation, hall ticket, backlog, kt]
      quick_questions:
        - "What is the process for applying for re-evaluation?"
        - "When is a change of marks accepted after re-evaluation?"
        - "How are SGPA and CGPA calculated?"
    - key: "attendance"
      label: "Attendance & Policies"
      routed_to: "Academic Coordinator"
      keywords: [attendance, policy, leave, defaulter, rule, integrity, plagiarism, absence]
      quick_questions:
        - "What is the minimum attendance requirement?"
        - "What CGPA is needed for an Honours or Minor degree?"
    - key: "facilities"
      label: "Labs & Facilities"
      routed_to: "Laboratory In-charge"
      keywords: [lab, computer, wifi, internet, projector, workstation, gpu, software, library, classroom]
      quick_questions:
        - "What facilities are available in the department labs?"
    - key: "careers"
      label: "Placements & Higher Studies"
      routed_to: "Training & Placement Cell"
      keywords: [placement, internship, company, recruit, career, job, higher studies, gre, abroad]
      quick_questions:
        - "Which companies recruit from the Computer Engineering department?"
    - key: "general"
      label: "General Enquiry"
      routed_to: "Help Desk"
      keywords: []
      quick_questions:
        - "What is the vision of the Computer Engineering department?"

