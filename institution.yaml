# ============================================================================
# DJSCE Institutional Brain — INSTITUTION PROFILE
# ============================================================================
# Single source of truth for branding, settings, help-desk routing and people.
# Mounted read-only into the backend containers; restart them to apply edits.
#
# NOTE: Every person below is a SYNTHETIC demonstration identity. None of them
# represent real DJSCE staff or students, and nothing seeded from this file is an
# official college record.
# ============================================================================

institution:
  name: "DJSCE Institutional Brain"
  short_code: "DJSCE"
  full_name: "Dwarkadas J. Sanghvi College of Engineering"
  logo: "/branding/djsce-logo.png"   # served by the frontend from frontend/public/; omit for a text badge
  email_domain: "example.com"

settings:
  pa_checkin_hour: 17            # Local hour (0-23) for the Faculty Desk end-of-day check-in
  commitment_followup_hours: 48  # A commitment idle this long gets a follow-up nudge

# ── Departments ──────────────────────────────────────────────────────────────
# Codes are stored on users, documents and meetings. Students and faculty retrieve
# their own department's material plus institution-wide ("all") material;
# coordinators and administrators see every department.
departments:
  - { code: "CE",    name: "Computer Engineering" }
  - { code: "IT",    name: "Information Technology" }
  - { code: "AIDS",  name: "Artificial Intelligence and Data Science" }
  - { code: "AIML",  name: "Artificial Intelligence and Machine Learning" }
  - { code: "CSDS",  name: "Computer Science and Engineering (Data Science)" }
  - { code: "IOTCS", name: "Computer Science and Engineering (IoT and Cyber Security with Blockchain Technology)" }
  - { code: "EXTC",  name: "Electronics and Telecommunication Engineering" }
  - { code: "MECH",  name: "Mechanical Engineering" }
  - { code: "BSH",   name: "Basic Sciences and Humanities" }

